[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spion-quant"
version = "0.1.0"
description = "Voxel-wise quantification of SPION concentration from multi-echo MRI"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "Yael Suarez" }]
keywords = ["MRI", "relaxometry", "T2", "SPION", "iron oxide", "DICOM", "segmentation"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Image Processing",
]

# Lower bounds for installation. requirements.txt pins the exact versions the
# published analysis was produced with; use that to reproduce the manuscript,
# and this to install the library.
dependencies = [
    "numpy>=1.26",
    "pandas>=2.0",
    "scipy>=1.11",
    "scikit-image>=0.22",
    "scikit-learn>=1.5",
    "pydicom>=3.0",          # 3.x API: save_as(..., enforce_file_format=True)
    "nibabel>=5.0",          # NIfTI masks, human/mouse samples
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "joblib>=1.3",
]

[project.optional-dependencies]
viewer = ["PyQt5>=5.15"]     # only needed for the interactive echo-time viewer
report = ["reportlab>=4.0"]  # only needed for code_inventory_pdf.py
dev = ["pytest>=8.0"]

[project.scripts]
echoviewer = "echoviewer.__main__:main"

[project.urls]
# TODO: fill in once the repository is public
# Repository = "https://github.com/<user>/SPION_Quant"

[tool.setuptools]
# Only the reusable engine is packaged. data_treatment/ and human/ are
# manuscript-specific scripts, run in place rather than imported.
packages = ["echoviewer"]
py-modules = ["config"]

[tool.pytest.ini_options]
testpaths = ["tests"]
